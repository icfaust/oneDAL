name: Check Basekit
on: 
  schedule:
    - cron: "0 0 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: write

jobs:
  check-basekit-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attempt PR
        run: |
          date > probe.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b test-permission-branch
          git add .
          git commit -m "Permission probe"
          git push origin test-permission-branch
          gh pr create --title "Test PR" --body "Checking if Actions can make PRs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
